name: CI

on:
  pull_request:
  push:
    branches: [main]

# En az yetki: iş akışı yalnız kodu okur.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

# Üçüncü taraf action'lar etiketle değil commit SHA'sıyla sabitlenir (etiket sonradan
# başka koda taşınabilir). Güncellemeyi Dependabot yapar (.github/dependabot.yml).
jobs:
  check:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Tip denetimi
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Derleme
        run: npm run build
